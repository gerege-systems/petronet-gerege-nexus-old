# actionlint-ийн тохиргоо.
#
# `self-hosted` runner-ийн шошгыг actionlint мэддэггүй — GitHub-ийн үүлэн
# шошгуудын жагсаалттай тулгаад «unknown label» гэж хэлнэ. Тэр нь худал эерэг
# боловч жинхэнэ буруу бичсэн шошгыг ялгах арга ч мөн: энд бичигдээгүй шошго
# бол алдаа. Тиймээс шинэ runner нэмэхэд энэ жагсаалтад мөн нэмнэ.
self-hosted-runner:
  labels:
    # Windows build worker. Тэр машин дээр хөрш репогийн
    # runner зэрэгцэн ажилладаг тул шошго нь заавал — `self-hosted` дангаараа
    # хоёр репогийн ажлыг хольж явуулна. Дэлгэрэнгүй: docs/OPERATIONS.md.
    - petronet-win
