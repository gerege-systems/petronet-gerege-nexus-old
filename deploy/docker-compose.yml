# PetroNet, as a Gerege Nexus distribution.
#
# Four services: postgres, the platform's migrations, this product's binary, and
# the platform's shell. There is no second migration service: the petro module
# carries its own SQL (modules/petro/migrations/) and the platform runs a
# module's history alongside its own, in the same one-shot job. And no redis:
# the core runs without one and nothing on this host needs a second thing to
# keep alive.
#
# Required environment (deploy/.env, copied there by deploy.sh):
#   PETRONET_POSTGRES_PASSWORD  this stack's own database
#   SSO_DEFAULT_CLIENT_SECRET   the platform refuses to start without it in
#                               production — see config.ValidateProduction
#   PUBLIC_ORIGIN               where this instance answers
#
# THE PORTS ARE NOT THE CORE'S DEFAULTS. A neighbouring product used to share
# this host and already held 127.0.0.1:8082 — the port the core's
# `snippets/nexus-oauth.conf` hardcodes — along with 3008 and 5434. That
# neighbour went away on 2026-09-03 and those ports are free again, but this
# stack stays where it is: renumbering a running deployment touches compose, the
# vhost, the certificates and every runbook, and buys nothing.
#
# The vhost still writes the OIDC locations out itself rather than including
# that snippet, for a reason the neighbour's departure does not change: the
# snippet names a port this stack's backend does not listen on.

name: petronet

# Shared container hardening, adapted from eid-gerege-mn.  Images that need to
# start as root (Postgres, Grafana, nginx) may still initialise normally, but a
# setuid binary cannot grant a process more privilege than it started with.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  # Хязгааргүй json-file лог дискийг дүүргэтэл өсдөг. Доорх статик сайтууд
  # үүнийг аль хэдийн тавьсан, бусад сервис юу ч өвлөөгүй байв.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    container_name: gerege_petronet_postgres
    restart: unless-stopped
    # Улаанбаатарын цаг, кластерын түвшинд.
    #
    # Модуль нь `CURRENT_DATE`-ийг долоон газар хэрэглэдэг — иргэний өдрийн
    # эрх, ваучерын өдөр, хэмжүүрүүд. UTC дээр тэдгээр нь орон нутгийн 08:00
    # цагт эргэдэг: өдрийн эрх шөнө дунд биш өглөө сэргэж, «тайлагнаагүй»
    # жагсаалт эцсийн хугацааны дараа найман цаг хоосон харагдана. Go тал нь
    # `nexus.Now()`-оор аль хэдийн Улаанбаатарын цагтай байсан тул хоёр тал
    # өөр өдөр дээр ажиллаж байв.
    command: ["postgres", "-c", "timezone=Asia/Ulaanbaatar"]
    environment:
      TZ: ${TZ:-Asia/Ulaanbaatar}
      PGTZ: ${TZ:-Asia/Ulaanbaatar}
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PETRONET_POSTGRES_PASSWORD:?PETRONET_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - gerege_petronet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *hardening
    image: ${IMAGE:-petronet:latest}
    container_name: gerege_petronet_migrate
    # The platform's migrations, from the core version this product's go.mod
    # pins — the image carries both, so they cannot drift apart.
    command: ["/app/migrate", "up"]
    environment:
      TZ: ${TZ:-Asia/Ulaanbaatar}
      DATABASE_URL: postgres://postgres:${PETRONET_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *hardening
    image: ${IMAGE:-petronet:latest}
    container_name: gerege_petronet_backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ulaanbaatar}
      DATABASE_URL: postgres://postgres:${PETRONET_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
      ENVIRONMENT: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://petronet.mn}
      # Хөтчийн шугам + төхөөрөмжийн дөрвөн шугам. Native клиент бүр өөрийн
      # host-оор ханддаг тул тэдгээр origin энд байхгүй бол cookie-той бичих
      # дуудлага бүр CSRF шалгалт дээр унана (`native-apps/shared/device_lines.json`).
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://petronet.mn},${DEVICE_LINE_ORIGINS:-https://desktop.petronet.mn,https://mobile.petronet.mn,https://kiosk.petronet.mn,https://pos.petronet.mn}
      # nginx terminates TLS in front of this, so the forwarded client address
      # can be trusted — and the login rate limiter counts on it being real.
      TRUST_PROXY_HEADERS: "true"

      # The catalogue shipped in the image. File mode: an instance that pulled a
      # catalogue from a registry would be offering whatever that registry says
      # today rather than what this binary can actually run.
      APP_CATALOG_PATH: /app/catalog/apps.json
      APP_CATALOG_URL: ""

      # Its own issuer, and its own sign-in. This deployment identifies people
      # itself — no SSO_CLIENT_ISSUER — so every OAuth callback it mints points
      # at itself and /login asks here.
      SSO_DEFAULT_CLIENT_SECRET: ${SSO_DEFAULT_CLIENT_SECRET:?SSO_DEFAULT_CLIENT_SECRET is required}

      # What this deployment calls itself. The browser app is given the same
      # name and more below; these are halves of one setting, and a stack that
      # renames only one of them has a sign-in screen and an eID prompt
      # disagreeing about which product somebody is standing in front of.
      BRAND_NAME: ${BRAND_NAME:-}

      # The operator console's hostname. Both halves of the stack are told,
      # because both gate on it: the API answers 404 to a /api/platform/v1
      # request that arrived on any other name, and the shell answers 404 to
      # /cp. Empty in production means this deployment has no console at all.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}

      # OIDC-ээр нэвтэрсэн хүнийг эргүүлж явуулж болох хостууд.
      #
      # Яг таарах нэрсийн жагсаалт: дэд домэйн ӨВЛӨГДӨХГҮЙ. `petronet.mn`
      # бичсэн нь `monitor.petronet.mn`-ыг зөвшөөрөхгүй — тус бүрийг нэрлэнэ.
      # Хоосон орхивол цөмийн анхдагч (nexus.gerege.mn) хүчинтэй болж, энэ
      # системийн redirect бүр «redirect URI host is not allowed» гэж унана.
      OAUTH_REDIRECT_HOSTS: ${OAUTH_REDIRECT_HOSTS:-monitor.petronet.mn}

      # Whether a stranger who proves an identity gets an account.
      #
      # public, and that is this product's design rather than a relaxation: a
      # citizen arriving with eID is the point, and since migration 00085 a new
      # account lands in that person's own home — not in anybody's
      # organisation. Joining an organisation stays a separate act with its own
      # answer.
      #
      # Written here rather than left to the console because a deployment that
      # is public by design should not depend on somebody remembering to switch
      # it after every fresh install; until they do, eID answers 403 to
      # everybody. The console still wins over this value.
      PLATFORM_ACCESS_MODE: ${PLATFORM_ACCESS_MODE:-}

      # Where the console reads this deployment's metrics. The service below,
      # over the compose network — never the published port, which is bound to
      # loopback for an operator with an SSH tunnel.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}

      # eID Mongolia, as this deployment's relying party.
      #
      # The pair is what turns the sign-in screen's eID card from a button that
      # answers "session could not be started" into a request on somebody's
      # phone: without them the client is built and refuses at the first call.
      # The name and the display text are not decoration — they are what the
      # citizen reads in the app before approving, and their defaults in the
      # core are the core's own product name, so a deployment that leaves them
      # empty asks people to approve a sign-in to something they never opened.
      #
      # The callback registered with eID for this RP must be exactly
      #   ${PUBLIC_ORIGIN}/auth/eid/callback
      # The platform refuses any other host or path before it ever calls out.
      EID_RP_UUID: ${EID_RP_UUID:-}
      EID_RP_SECRET: ${EID_RP_SECRET:-}
      EID_RP_NAME: ${EID_RP_NAME:-}
      EID_DISPLAY_TEXT: ${EID_DISPLAY_TEXT:-}
      EID_BASE_URL: ${EID_BASE_URL:-}
      # Canned identities. Unset already means "off" in production; written
      # here so that turning it on is a deliberate line in .env rather than a
      # thing that could happen by accident.
      EID_MOCK_MODE: ${EID_MOCK_MODE:-false}

      # The Gerege Core register, which the first-run wizard and the
      # organisation screen search by registration number. Without it those
      # screens are typed in by hand — which is how a deployment ends up
      # calling itself something the invoices do not. The URL defaults to
      # core.gerege.mn; only the token is a deployment's own.
      GEREGE_CORE_TOKEN: ${GEREGE_CORE_TOKEN:-}

      # Google-ээр нэвтрэх. CLIENT_ID хоосон бол унтраалттай — нэвтрэх дэлгэц
      # Google товчийг огт зурахгүй.
      #
      # Google дээр бүртгэсэн redirect URI яг ${PUBLIC_ORIGIN}/api/v1/auth/google/callback
      # байх ёстой; зам нь цөмийн тогтмол тул өөрчлөх боломжгүй.
      #
      # ALLOWED_DOMAINS хоосон нь «дурын Google данс орно» гэсэн үг БИШ:
      # TENANT нэрлээгүй бол шинэ бүртгэл үүсэхгүй, зөвхөн аль хэдийн энд
      # байгаа данс руу л хүрнэ. Хоёуланг нь хамт тохируулж байж домэйн
      # шүүлтүүр утгатай болно.
      GOOGLE_LOGIN_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID:-}
      GOOGLE_LOGIN_CLIENT_SECRET: ${GOOGLE_LOGIN_CLIENT_SECRET:-}
      GOOGLE_LOGIN_ALLOWED_DOMAINS: ${GOOGLE_LOGIN_ALLOWED_DOMAINS:-}
      GOOGLE_LOGIN_TENANT: ${GOOGLE_LOGIN_TENANT:-}

      # Fuel network policy and optional demo routing. Demo movement is off in
      # production unless an operator deliberately enables it.
      FUEL_DAILY_GRANT_MNT: ${FUEL_DAILY_GRANT_MNT:-}

      # No demo data in production. The seeded account has a published password.
      SEED_DEMO_DATA: "false"
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:8098:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PetroNet's shell with the Fuel module's map, operator screens and public
  # information pages. deploy.sh builds this image from frontend/ together with
  # the backend so the two halves are rolled out as one revision.
  web:
    <<: *hardening
    image: petronet-web:latest
    container_name: gerege_petronet_web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ulaanbaatar}
      NODE_ENV: production
      # Where the shell asks, server-side, what this deployment is. The browser
      # never uses it: it asks its own origin (lib/apiBase.ts). A server has no
      # origin, which is the whole reason this exists.
      API_INTERNAL_URL: http://backend:8080/api/v1
      # The console's hostname again, and it must be the same value the API was
      # given: the shell decides from it whether a request is the console's or
      # the platform's, and a stack whose two halves disagree serves the
      # platform's pages on the console's address.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}
      # Read per request — see frontend/lib/brand.ts — so brand is a setting
      # rather than a build.
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_THEME_COLOR: ${BRAND_THEME_COLOR:-}
      BRAND_ICON_URL: ${BRAND_ICON_URL:-}
      BRAND_MASKABLE_ICON_URL: ${BRAND_MASKABLE_ICON_URL:-}

      # Платформын хажууд өөрийн хаягтай зогсдог үйлчилгээнүүд. Нүүр хуудас
      # эдгээрийг карт болгож зурна — зөвхөн хаяг нь тохируулагдсаныг.
      #
      # Хаяггүйг нь зурахгүй байх нь цөмийн санаатай анхдагч: систем болгонд
      # зургаа нь байдаггүй бөгөөд шийдэгддэггүй хостыг заасан карт нь
      # картгүй байхаас дор. Тиймээс энд зөвхөн PetroNet System-д ҮНЭХЭЭР байгаа
      # хоёр нь дүүрнэ; үлдсэн дөрөв нь хоосон бөгөөд хуудсан дээр огт
      # гарахгүй.
      SERVICE_URL_EID: ${SERVICE_URL_EID:-}
      SERVICE_URL_ADMIN: ${SERVICE_URL_ADMIN:-}
      SERVICE_URL_DWH: ${SERVICE_URL_DWH:-}
      SERVICE_URL_BACKUPS: ${SERVICE_URL_BACKUPS:-}
      SERVICE_URL_MONITOR: ${SERVICE_URL_MONITOR:-}
      SERVICE_URL_DOCS: ${SERVICE_URL_DOCS:-}
      # Газрын зургийн хоёр эх сурвалж. Хоёулаа серверийн тал уншина
      # (NEXT_PUBLIC_ биш): хөтөч энэ origin-ы /tiles ба /basemap-ыг л мэднэ.
      # Вектор нь Улаанбаатарын нарийвчлал, растер нь улсын хамрах хүрээ.
      MAP_RASTER_UPSTREAM: ${MAP_RASTER_UPSTREAM:-}
    ports:
      - "127.0.0.1:3018:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The console's metrics, and nothing else.
  #
  # One target — this product's own API — because the console's queries carry
  # no job filter: sharing the neighbour's Prometheus would have shown two
  # products' traffic under this deployment's name. Small retention to match
  # the job: 15 days is longer than any question this screen answers.
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.1.0
    container_name: gerege_petronet_prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - gerege_petronet_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9092:9090"
    depends_on:
      backend:
        condition: service_healthy

  # Хостын диск, санах ой, CPU.
  #
  # Хөрш систем дээр node_exporter аль хэдийн ажилладаг ч түүний порт нь
  # 127.0.0.1 дээр уягдсан: контейнерээс хостын loopback руу хүрэх зам байхгүй
  # тул түүнийг хуваалцах боломжгүй. Өөрийнхөө нэгийг ажиллуулах нь ижил
  # хостын ижил тоог хоёр удаа хэмжинэ — тэр давхардлын үнэ нь энэ стек
  # хөршөөсөө хамааралгүй байх явдал.
  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.9.0
    container_name: gerege_petronet_node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # Нөөцлөлтийн скрипт өөрийн хэмжигдэхүүнээ энд бичдэг (backup.sh-ийн
      # TEXTFILE_DIR). Тэр хавтас хоосон байхад ч зам нь тодорхойлогдсон
      # байх ёстой, эс бөгөөс эхний нөөцлөлт хэмжигдэхгүй өнгөрнө.
      - --collector.textfile.directory=/var/lib/node_exporter
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter:/var/lib/node_exporter:ro
    ports:
      - "127.0.0.1:9101:9100"

  # PetroNet System-ийн сан — хөршийнх биш.
  #
  # DATA_SOURCE_NAME нь compose-ийн дотоод сүлжээгээр өөрийн postgres руу
  # заана. Хостын порт (5440) руу заасан бол хөршийн сан руу заах алдаа нэг
  # тэмдэгтийн зайд байх байв.
  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: gerege_petronet_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgres://postgres:${PETRONET_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
    ports:
      - "127.0.0.1:9188:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # Самбарууд. monitor.petronet.mn-ийн ард зогсох цорын ганц зүйл.
  #
  # Дэд зам биш, домэйны үндэс дээр: энэ хаяг дээр Grafana-гаас өөр юу ч
  # байхгүй тул `GF_SERVER_SERVE_FROM_SUB_PATH` хэрэггүй — тэр нь холбоос
  # бүрийг эвддэг тохиргоо бөгөөд шаардлагагүй үед асаах нь дэмий эрсдэл.
  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.0
    container_name: gerege_petronet_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # Grafana нь дэд зам дээр сууна: домэйны үндэс дээр ажиглалтын landing
      # хуудас үйлчилдэг (deploy/monitor-landing/index.html). Дагалдах
      # SERVE_FROM_SUB_PATH байхгүй бол Grafana өөрийгөө үндэс дээр байгаа гэж
      # үзэж, статик файлаа буруу замаар нэхнэ.
      GF_SERVER_ROOT_URL: ${MONITORING_PUBLIC_URL:-https://monitor.petronet.mn}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Ажиглалтын самбарт хэн ч бүртгүүлэхгүй.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Загвар. 11.x-д зөвхөн dark/light байсан; 12-оос хойш desertbloom,
      # gildedgrove, sapphiredusk, tron, gloom нэмэгдсэн бөгөөд хэрэглэгч
      # бүр өөрийнхөө сонголтыг Profile → Preferences дотроос сольж болно.
      GF_USERS_DEFAULT_THEME: ${GRAFANA_DEFAULT_THEME:-light}
      # Хэл. `sv-SE` нь Монгол хэлний үүр: Grafana-д `mn` locale байхгүй тул
      # deploy/scripts/setup_monitor_branding.sh тэр chunk-ийг монгол
      # орчуулгаар nginx дээр орлуулдаг. Скриптийг ажиллуулаагүй хостод
      # энэ утгыг битгий sv-SE болго — швед хэл гарч ирнэ.
      GF_USERS_DEFAULT_LANGUAGE: ${GRAFANA_DEFAULT_LANGUAGE:-en-US}
      # ---------------------------------------------- платформоор нэвтрэх
      #
      # Grafana PetroNet System-ийн өөрийн OIDC provider-оос хэн болохыг асууна:
      # операторууд аль хэдийн байгаа бүртгэлээрээ ордог, платформын админ нь
      # Grafana-ийн сервер админ болно.
      #
      # Дээрх GF_SECURITY_ADMIN_PASSWORD хэвээр байна — энэ нь буцаж орох зам.
      # Унасан танигч нь нээгдэхгүй ажиглалтын стек болох ёсгүй: тэр нь яг
      # түүнийг хэрэгтэй болгодог цаг.
      #
      # GRAFANA_OAUTH_ENABLED тавигдаагүй бол унтраалттай: клиент бүртгээгүй
      # систем алдааны хуудас руу хөтөлдөг товч харуулах учиргүй.
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OAUTH_NAME:-PetroNet}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email roles"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${PUBLIC_ORIGIN:-https://petronet.mn}/oauth2/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${PUBLIC_ORIGIN:-https://petronet.mn}/oauth2/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${PUBLIC_ORIGIN:-https://petronet.mn}/oauth2/userinfo
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      # Claim дээрх JMESPath. Зөвхөн платформын админ орно.
      #
      # Өмнө нь бусад нь Viewer болдог байв. Энэ систем PLATFORM_ACCESS_MODE=public
      # бөгөөд Grafana-гийн клиент каталогт байхгүй тул цөмийн хаалга түүнийг
      # «зөвшөөрөгдсөн» гэж үзэж, eID-ээр нэвтэрсэн ДУРЫН иргэн хост ба сангийн
      # самбарыг харах эрхтэй болж байв.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "platform_admin && 'GrafanaAdmin' || ''"
      # Дээрх зам сервер админы эрх өгөхийн өмнө заавал хэрэгтэй; үүнгүйгээр
      # GrafanaAdmin нь чимээгүйхэн зүгээр Admin болно.
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      # Хоосон үүрэг = нэвтрэлтээс татгалзах. Буцаж орох зам нь дээрх
      # GF_SECURITY_ADMIN_PASSWORD хэвээр.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      # Grafana-гийн өөрийн /metrics нэвтрэлтгүй бөгөөд Prometheus үүнийг
      # цуглуулдаггүй — нийтэд нээлттэй байх шалтгаан алга.
      GF_METRICS_ENABLED: "false"
      # Provider нь PKCE дэмждэг бөгөөд энэ нь браузараас эхэлдэг урсгал:
      # PKCE-гүй ажиллуулах шалтгаан алга.
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # Provider батлан даасан бүртгэл Grafana-ийн бүртгэлтэй болно. Өөр
      # хувилбар нь хэн болохыг нь дөнгөж хэлж өгсөн системд оператор бүрийг
      # гараар урих явдал.
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # Grafana-аас гарахад браузар платформоос ч гарна. Үүнгүйгээр «гарах»
      # нь provider-ийн session-ийг зогсоолгүй үлдээж, дараагийн товшилт
      # шууд буцаж нэвтрүүлнэ — тэр нь эвдэрсэн товч мэт уншигдана.
      #
      # `client_id` нь заавал: logout цэг клиентийг түүгээр (эсвэл
      # id_token_hint-ээр) тодорхойлж, буцах хаягийг ТЭР клиентийн
      # бүртгэлтэй жагсаалттай тулгадаг. Параметргүй бол тулгах клиент
      # байхгүй тул браузар «post_logout_redirect_uri is not registered»
      # дээр бууна — тэр нь дутуу биш, буруу URI мэт уншигдана.
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${PUBLIC_ORIGIN:-https://petronet.mn}/oauth2/logout?client_id=${GRAFANA_OAUTH_CLIENT_ID:-}&post_logout_redirect_uri=${MONITORING_PUBLIC_URL:-https://monitor.petronet.mn}/grafana/login
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Grafana-гийн өөрийн сэрэмжлүүлэг унтраалттай: хоёр систем хоёр багц
      # дүрэм бодох нь «ямар нэг зүйл буруу байна уу» гэсэн асуултад хоёр
      # хариулт өгнө. PetroNet System-д дүрмийн хөдөлгүүр нь Prometheus.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gerege_petronet_grafana_data:/var/lib/grafana
    ports:
      # 3009 нь хөршийн Grafana-гийнх. Порт бүр нэг л эзэнтэй.
      - "127.0.0.1:3019:3000"
    depends_on:
      - prometheus

  # Гурван статик хуудас, гурван нэр.
  #
  # Хостын nginx-ээс шууд файл өгч ч болох байсан. Контейнерт байгаа шалтгаан
  # нь цөмийн dwh стекийнхтэй ижил: агуулга нь репод, зам нь compose-д, тиймээс
  # шинэчлэх нь `git pull && docker compose restart` — хостын файлын систем рүү
  # гараар хуулах алхам байхгүй. Гурвуулаа read-only, эрх нэмэгдэхгүй, зөвхөн
  # loopback: TLS ба толгойнууд хостын nginx дээр.
  dwh: &static-site
    <<: *hardening
    image: nginx:1.29-alpine
    container_name: gerege_petronet_dwh
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:80"
    volumes:
      - ./dwh-landing:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Баримт бичгийн сайт — MkDocs-ийн угсарсан мод.
  #
  # Гараар бичсэн нэг хуудас байсныг сольсон: захиалагч тал платформын бүх
  # баримтыг нэг газраас уншиж чадах ёстой бөгөөд тэдгээр нь долоон хэлээр,
  # хайлттай, навигацитай байх ёстой. Гараар бичсэн хуудас тэр гурвыг өгөхгүй.
  #
  # Агуулга нь `docs/*.md`, гаралт нь артефакт (.gitignore). Угсрах:
  #   sh docs/mkdocs/build.sh
  # Хостод Python суулгахгүй — MkDocs контейнерээр ажиллана.
  docs:
    <<: *static-site
    container_name: gerege_petronet_docs
    ports:
      - "127.0.0.1:3021:80"
    volumes:
      - ../docs/mkdocs/build/site:/usr/share/nginx/html:ro

  # Төслийн баримт — захиалагчийн шаардлага, хөгжүүлэлтийн төлөвлөгөө, жишиг.
  # docs-оос тусдаа сайт байгаа нь хоёр өөр уншигч, хоёр өөр амьдралын
  # мөчлөгтэйгээс: төлөвлөгөө сар бүр өөрчлөгддөг, ажиллагааны баримт кодтойгоо
  # хамт хөдөлдөг. Угсрах нь `sh docs/mkdocs/build.sh plan`.
  plan:
    <<: *static-site
    container_name: gerege_petronet_plan
    ports:
      - "127.0.0.1:3023:80"
    volumes:
      - ../docs/mkdocs/build-plan/site:/usr/share/nginx/html:ro

  backups:
    <<: *static-site
    container_name: gerege_petronet_backups
    ports:
      - "127.0.0.1:3022:80"
    volumes:
      - ./backups-landing:/usr/share/nginx/html:ro

volumes:
  gerege_petronet_postgres_data:
  gerege_petronet_prometheus_data:
  gerege_petronet_grafana_data:
