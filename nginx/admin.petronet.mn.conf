# admin.petronet.mn — операторын консол.
#
# Платформын ижил хоёр upstream дээрх тусдаа vhost. Шинэ юу ч нийтлэгдэхгүй:
# консол гэдэг нь API дээрх /api/platform/v1 (8098) ба бүрхүүл дээрх /cp
# (3018) — тэднийг тусдаа зүйл болгож байгаа нь энэ файл.
#
# Дэлгэрэнгүй: цөмийн docs/CONTROL_PLANE.md.
#
# ХАЯГИЙН ЖАГСААЛТ ЭНД ОРООГҮЙ. Цөмийн жишиг vhost нь `cp-allowlist.conf`-ыг
# server түвшинд include хийдэг бөгөөд тэр snippet-ийн шигшсэн хувилбар нь
# бүгдийг татгалздаг — операторуудынхаа хаягийг мэдэхээс өмнө консолыг
# нээхгүй байх нь зөв төлөв. PetroNet System дээр тэр хаягууд хараахан
# тодорхойгүй тул include-ыг хассан: одоогоор консолыг хамгаалж байгаа зүйл
# нь CONTROL_PLANE_HOST-ийн хаалга (өөр нэрээр ирсэн хүсэлт 404), нууц үг,
# ба authenticator-ийн код гурав.
#
# Хаягууд тодрох өдөр энэ нь хоёр мөрийн ажил:
#
#   /etc/nginx/snippets/petronet-admin-allowlist.conf:
#     allow 203.0.113.10;   # оффис
#     deny all;
#   ба доорх `include snippets/petronet-admin-allowlist.conf;` мөрийг сэргээх.
#
# Энэ файлыг certbot-оос ӨМНӨ суулгана. ДАХИН ХУУЛАХАД БОЛГООМЖИЛ:
# энэ файл өөрчлөгдөөд түүнийг sites-available дээр дахин хуулах нь certbot-ийн
# нэмсэн 443 блокийг арчиж, домэйныг HTTPS дээр бүтэн унагана (nginx -t нь
# өнгөрнө — синтакс зөв, гэхдээ зөвхөн 80 сонсоно). Хуулсан бол заавал:
#   certbot --nginx -d admin.petronet.mn --non-interactive --redirect

# Консолын өөрийн нэвтрэлтийн төсөв, платформынхаас тусдаа. Нэгийг хуваалцвал
# нийтийн нэвтрэх дэлгэц рүү хийсэн довтолгоо операторын төсвийг идэж, түүнийг
# орж чадахгүй болгоно.
limit_req_zone $binary_remote_addr zone=petronet_admin_auth:10m rate=30r/m;

server {
    listen 80;
    server_name admin.petronet.mn;

    # nginx is the one authority for stable edge headers. The per-request CSP
    # from Next.js is intentionally not hidden.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;

    # Excel тайлан илгээх зам. Анхдагч нь 1 МБ бөгөөд арван мянган мөртэй
    # workbook түүнээс том — хязгаарыг нэрлэхгүй орхивол илгээгч 413 авна.
    client_max_body_size 8m;

    # HTTP/2. Certbot нь `listen 443 ssl` мөрийг өөрөө бичдэг ба тэр мөрөнд
    # протоколыг нэмдэггүй, тиймээс энэ нь тусдаа заавар байх ёстой — тэгвэл
    # гэрчилгээ шинэчлэх бүрд алга болохгүй. Үүнгүй байсны улмаас энэ домэйн
    # HTTP/2 шилжилтийн дараа ч HTTP/1.1 дээр үлдсэн байв.
    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # include snippets/petronet-admin-allowlist.conf;

    # Консол нь хайлтын робот, урьдчилсан харагдац, ямар нэг холбоос дагадаг
    # зүйлд зориулагдаагүй. Мөн frame дотор орох ёсгүй.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Нэвтрэх ба хоёр дахь хүчин зүйл — таах нь ашигтай хоёр цэг тул хамтдаа
    # хязгаарлагдана.
    location ~ ^/api/platform/v1/(session|step-up)$ {
        limit_req zone=petronet_admin_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/platform/v1/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        # Host нь API-гийн өөрийн хаалга CONTROL_PLANE_HOST-той харьцуулдаг
        # утга. Тогтмол бичихийн оронд $host дамжуулснаар энэ файл түүний
        # утгыг мэдэх шаардлагагүйгээр хоёр тал тохирно.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Энэ хаяг дээр root нь консол өөрөө.
    location = / {
        return 308 /cp;
    }

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade, not a bare "upgrade": sending the header on
        # every request breaks upstream keepalive for the ordinary ones.
        proxy_set_header Connection $connection_upgrade;
    }
}
