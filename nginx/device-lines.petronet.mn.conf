# Төхөөрөмжийн шугамууд — form factor тутамд нэг host, ард нь НЭГ backend.
#
#   desktop.petronet.mn  macOS, Windows ширээний клиент
#   mobile.petronet.mn   iOS / iPadOS, Android
#   kiosk.petronet.mn    Kiosk (Windows, Android) — клиент хараахан байхгүй
#   pos.petronet.mn      ШТС-ын POS (Windows, Android) — клиент хараахан байхгүй
#
# Хаяг нь хүн төхөөрөмжийг ХЭРХЭН БАРЬДГИЙГ нэрлэнэ, үйлдлийн системийг биш:
# нэг ширээн дээрх Mac ба Windows хоёр нэг шугам. Аль клиент нь ажиллаж
# байгаа нь тусдаа асуулт бөгөөд түүнд `window.GeregeShell` хариулна.
# kiosk ба pos нь тусдаа үлдэнэ: нэг Windows машин дээр ажлын ширээний клиент
# ба киоск зэрэг ажиллаж болох тул тэдэнд өөр өөр cookie сав хэрэгтэй.
# Эх сурвалж: `native-apps/shared/device_lines.json`.
#
# Upstream нь `petronet.mn`-тэй ЯГ ИЖИЛ хоёр порт: 3018 бүрхүүл, 8098 API —
# цөмийн анхдагч 3000/8080 БИШ (шалтгааныг `nginx/petronet.mn.conf` бичсэн).
# Шугам нь backend-ийг салгадаггүй: шугам байгаа учир нь клиент бүр өөрийн
# origin-той байх, өөрийн сервистэй байх нь БИШ.
#
# Шугам бүрийн дор `/api/` үйлчилж байгаа нь тав тух биш, дизайны цөм: ингэснээр
# webview доторх дуудлага same-origin болж, session cookie нь `SameSite=Strict`
# хэвээр ажиллаж, CORS preflight огт үүсэхгүй. Эдгээр блокийг хасаад клиентийг
# `petronet.mn` руу заавал cookie-тэй бичих бүр дуудлага cross-site болно.
#
# DNS дээр `*.petronet.mn` wildcard БАЙГАА тул шинэ шугамд A бичлэг нэмэх
# шаардлагагүй. Гэхдээ энд server_name нь дөрвөн нэрийг ЖАГСААНА, wildcard БИШ:
# энэ IP дээр өөр бүтээгдэхүүний домэйнууд сууж байгаа бөгөөд wildcard
# server_name нь ирээдүйн өөр дэд домэйныг чимээгүй залгих байсан. DNS-ийн
# wildcard нь нэрийг ЭНД хүргэнэ, харин юуг үйлчлэхийг энэ жагсаалт шийднэ.
#
# Гэрчилгээг 2026-09-05-нд дөрвөн нэрээр авсан (2026-12-04 хүртэл):
#   certbot --nginx -d desktop.petronet.mn -d mobile.petronet.mn \
#           -d kiosk.petronet.mn -d pos.petronet.mn
# Certbot энэ файлыг ГАЗАР ДЭЭР НЬ засаж `listen 443 ssl` мөрүүд, 80 → https
# чиглүүлэгч блокийг нэмнэ. Тэдгээрийг гараар бүү бич; мөн энэ файлыг дахин
# хуулбал certbot-ийн нэмсэн блок арчигдана (`nginx -t` өнгөрнө — синтакс зөв,
# зөвхөн 80 сонсоно) тул хуулсан бол certbot-ыг дахин ажиллуул.
#
# Zone-ийн нэр нь `petronet.mn.conf`-ынхоос ӨӨР байх ёстой: нэг нэртэй хоёр
# limit_req_zone нь тохиргооны алдаа бөгөөд нэг төсвийг хөтчийн шугам ба
# төхөөрөмжийн шугам хоёр хуваах нь нэг нь нөгөөгөө өлсгөх зам.
limit_req_zone $binary_remote_addr zone=device_auth:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=device_oauth:10m rate=600r/m;

server {
    listen 80;
    server_name desktop.petronet.mn mobile.petronet.mn
                kiosk.petronet.mn pos.petronet.mn;

    # Тогтвортой толгойнуудыг нийтийн ирмэг дээрээ өөрөө эзэмшинэ. Хоёр upstream
    # бас тэднийг илгээдэг тул эхлээд тэдгээр хуулбарыг нуу: давхардсан
    # X-Frame-Options-ыг хөтчүүд ижил тайлбарладаггүй. Вэбийн хүсэлт тутмын CSP
    # нь үл хамаарах зүйл — түүний nonce нь тэр HTML хариунд харьяалагдана.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    client_max_body_size 8m;
    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        # Host-ыг ХЭВЭЭР дамжуулна — frontend түүнийг уншиж аль шугамыг
        # үйлчилж байгаагаа шийднэ (`frontend/proxy.ts`). Нэг нэр рүү
        # хувиргах нь дөрвөн шугамыг нэг болгож нураана.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Байрлуулалтын өөрийн лого, icon — `petronet.mn`-тэй ижил эх сурвалж.
    location /brand/ {
        alias /opt/petronet/brand/;
        access_log off;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8098/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll нь 25 секунд онгорхой байдаг long poll.
        proxy_read_timeout 90s;
    }

    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=device_auth burst=100 nodelay;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- OIDC
    # `location /` бүх зүйлийг frontend рүү явуулдаг тул эдгээргүй бол
    # /oauth2/auth ба discovery баримт Next.js-ийн бүрхүүлээр хариулагдаж,
    # шугам дээрээс эхэлсэн нэвтрэлт хэзээ ч ирэхгүй.
    #
    # `include snippets/nexus-oauth.conf` БИШ, гараар бичсэн: тэр snippet
    # цөмийн стекийнх бөгөөд 127.0.0.1:8082-ыг хатуу заасан — энэ стекийн
    # backend 8098 дээр байна.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth2/token {
        limit_req zone=device_oauth burst=200 nodelay;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/appstore-keys.json {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
