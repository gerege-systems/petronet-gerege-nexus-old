# monitor.petronet.mn — ажиглалтын landing хуудас ба Grafana.
#
# Домэйны үндэс дээр landing хуудас, Grafana нь `/grafana/` дэд зам дээр
# (`GF_SERVER_SERVE_FROM_SUB_PATH`). Хуучин холбоосууд (monitor.petronet.mn/d/…)
# ажиллана: доорх сүүлчийн `location /` тэднийг Grafana руу дамжуулж, Grafana
# өөрөө шинэ зам руу шилжүүлнэ.
#
# Брэндлэлт (нэвтрэх карт, лого, tab icon, Монгол хэл) нь ЭНЭ ФАЙЛД БАЙХГҮЙ:
# `deploy/scripts/setup_monitor_branding.sh` түүнийг /var/www/monitor руу
# суулгаад доор include хийгдсэн snippet-ийг үүсгэнэ. Хост бүр дээр нэг удаа,
# дараа нь Grafana шинэчлэх бүрд ажиллуулна — chunk-ийн нэрэн дэх hash
# өөрчлөгдөхөд орлуулалт таарахаа больдог.
#
# Хоёр урхи, хоёулаа хариу 200 хэвээр байхад чимээгүй ажилладаг (цөмийн
# docs/OPERATIONS.md, «nginx-ийн хоёр урхи»):
#
#   1. `add_header` өв залгамжлахгүй — хүү блок дотор НЭГ ч байвал дээд
#      түвшнийхийг БҮГДИЙГ нь хаяна. Тиймээс энэ файлын бүх `add_header` нь
#      server түвшинд, location блок дотор нэг ч байхгүй.
#   2. Certbot HTTP/2 бичдэггүй — `listen 443 ssl` мөрийг өөрөө бичээд
#      протоколыг нэмдэггүй. Тиймээс `http2 on;` нь тусдаа заавар: гэрчилгээ
#      шинэчлэх бүрд алга болохгүй.
#
# Суулгах (certbot-оос ӨМНӨ):
#   cp nginx/monitor.petronet.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/monitor.petronet.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d monitor.petronet.mn
#
# ДАХИН ХУУЛАХАД БОЛГООМЖИЛ. Энэ файл дараа нь өөрчлөгдвөл дээрх `cp`-г
# дахин ажиллуулах нь certbot-ийн нэмсэн 443 блокийг арчина — домэйн
# HTTPS дээр бүтэн унана (nginx -t нь өнгөрнө: синтакс зөв, гэхдээ сонсох
# порт нь 80 л үлдсэн байна). Хуулсан бол дараа нь заавал:
#   certbot --nginx -d monitor.petronet.mn --non-interactive --redirect

server {
    listen 80;
    server_name monitor.petronet.mn;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;

    # Excel тайлан илгээх зам. Анхдагч нь 1 МБ бөгөөд арван мянган мөртэй
    # workbook түүнээс том — хязгаарыг нэрлэхгүй орхивол илгээгч 413 авна.
    client_max_body_size 8m;

    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # nginx-ийн өгөгдмөл нь gzip_proxied off / gzip_types text/html — өөрөөр
    # хэлбэл proxy-оос ирсэн юуг ч дахин шахахгүй. Доорх Grafana-ийн блок нь
    # sub_filter HTML-ийг харж чадахын тулд Accept-Encoding-ийг цэвэрлэдэг;
    # энэ хосгүй бол түүний ард яваа JS багц бүр шахалтгүй гарна.
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Ажиглалтын самбар нь хайлтын робот, урьдчилсан харагдац, frame-д
    # зориулагдаагүй.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Grafana-гийн өөрийн /metrics нэвтрэлтгүй тул нийтэд хаана (compose дээр
    # GF_METRICS_ENABLED=false ч гэсэн — хоёр давхарга).
    location ~ ^/(grafana/)?metrics$ { return 404; }

    # Домэйныг бичсэн хүн юуны дээр ирснээ уншдаг хуудас. Grafana энэ
    # домэйны үндэс дээр сууж байсан үед энэ хуудсанд байх зай байгаагүй.
    location = / {
        root /var/www/monitor;
        try_files /index.html =404;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade, not a bare "upgrade": sending the header on
        # every request breaks upstream keepalive for the ordinary ones.
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;

        # Grafana OSS-д брэндлэх цэг байхгүй тул хэв маяг ба скриптийг HTML
        # бүрийн </head>-д энд оруулна. Хоёулаа НЭГ заавраар: nginx дараагийн
        # шүүлтүүрт өмнөх нь орлуулсан текстийг өгдөггүй.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/grafana-petronet.css"><script src="/grafana-petronet.js" defer></script></head>';
        sub_filter '<title>Grafana</title>' '<title>Ажиглалт — PetroNet System</title>';
        sub_filter_once on;
    }

    # Хуучин холбоосууд (monitor.petronet.mn/d/…). Grafana тэднийг өөрөө
    # /grafana/… руу шилжүүлнэ — тиймээс энд зөвхөн дамжуулна.
    location / {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade, not a bare "upgrade": sending the header on
        # every request breaks upstream keepalive for the ordinary ones.
        proxy_set_header Connection $connection_upgrade;
    }

    location = /grafana-petronet.css { root /var/www/monitor; }
    location = /grafana-petronet.js  { root /var/www/monitor; }

    # Landing хуудасны tab-ийн тэмдэг. Grafana-гийнх нь дээрх хоёр alias-аар
    # аль хэдийн брэндлэгдсэн ч домэйны үндэс дээрх хуудас түүнийг олж
    # чаддаггүй байв: `/favicon.ico` нь `location /`-оор Grafana руу унаж 301
    # авдаг. types блок нь css/js-ийнхтэй ижил шалтгаанаар — nginx төрлийг
    # өргөтгөлөөс уншдаг.
    location = /grafana-favicon.webp {
        root /var/www/monitor;
        types { } default_type image/webp;
    }

    # Браузарын tab дээрх болон утасны дэлгэц дээрх тэмдэг. nginx нь хариуны
    # төрлийг URI дахь өргөтгөлөөс тодорхойлдог болохоос alias-ийн заасан
    # файлаас биш — тиймээс хоосон types блок нь .webp файлыг image/png гэж
    # явуулахаас сэргийлнэ.
    location = /grafana/public/build/img/fav32.png {
        alias /var/www/monitor/grafana-favicon.webp;
        types { } default_type image/webp;
    }
    location = /grafana/public/build/img/apple-touch-icon.png {
        alias /var/www/monitor/grafana-favicon.webp;
        types { } default_type image/webp;
    }

    # deploy/scripts/setup_monitor_branding.sh үүсгэдэг: Grafana-ийн хоёр
    # chunk-ийг (хэлний жагсаалт ба орчуулга) орлуулах хоёр location. Файл
    # байхгүй байсан ч nginx унахгүй — брэндлэлтгүйгээр ажиллана.
    include /etc/nginx/snippets/monitor-grafana-overrides.conf*;
}
