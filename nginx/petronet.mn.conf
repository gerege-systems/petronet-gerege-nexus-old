# petronet.mn — PetroNet.
#
# Upstream портууд нь ЦӨМИЙН АНХДАГЧ БИШ: 3018 бүрхүүл, 8098 API. Сонголт нь
# түүхэн: энэ хост дээр хөрш систем зэрэгцэн ажиллаж, цөмийн анхдагч 3008/8082-ыг
# эзэлж байсан. Тэр систем 2026-09-03-нд алга болсон ч портууд ХЭВЭЭР үлдэнэ —
# ажиллаж буй суулгацын портыг солих нь compose, энэ файл, гэрчилгээ, түүх
# бүхнийг хөндөх бөгөөд хариуд нь юу ч өгөхгүй. deploy/docker-compose.yml-ийн
# published портууд болон энэ файл хамт өөрчлөгдөнө.
#
# Энэ vhost цөмийн `snippets/nexus-oauth.conf`-ыг include ХИЙХГҮЙ. Тэр snippet
# 127.0.0.1:8082 гэж хатуу бичсэн — энэ стекийн backend тэнд биш, 8098 дээр.
# (Урьд нь 8082 нь хөршийнх байсан тул include хийвэл petronet.mn өөр
# бүтээгдэхүүний discovery баримтыг тарааж эхлэх байсан. Хөрш алга болсон ч
# шалтгаан үлдэв: snippet биднийх биш портыг заасан хэвээр.) Тиймээс OIDC
# замуудыг доор өөрөө бичив.
#
# server_name нь яг хоёр хост: энэ IP дээр өөр олон домэйн сууж байгаа тул
# default_server ч, wildcard ч биш байх нь заавал.
#
# Энэ файлыг certbot-оос ӨМНӨ суулгана. ДАХИН ХУУЛАХАД БОЛГООМЖИЛ:
# энэ файл өөрчлөгдөөд түүнийг sites-available дээр дахин хуулах нь certbot-ийн
# нэмсэн 443 блокийг арчиж, домэйныг HTTPS дээр бүтэн унагана (nginx -t нь
# өнгөрнө — синтакс зөв, гэхдээ зөвхөн 80 сонсоно). Хуулсан бол заавал:
#   certbot --nginx -d petronet.mn --non-interactive --redirect Certbot үүнийг өөрөө засаж `listen 443
# ssl` мөрүүд, 80 → https чиглүүлэгч блокийг нэмнэ.
# Хязгаар яагаад өндөр вэ: энэ хост хуваалцсан TLS passthrough ирмэгийн ард
# сууна, PROXY protocol-гүй. $binary_remote_addr нь ҮРГЭЛЖ ирмэгийн нэг хаяг —
# өөрөөр хэлбэл энэ бол нэг хүний биш, БҮХ хэрэглэгчийн нийт сав. 5r/m үед
# 12 секунд тутам нэг хүсэлт илгээсэн хэн ч бүх иргэний нэвтрэлтийг 429 болгож
# байв. Энд зөвхөн flood-оос хамгаална; таах халдлагаас хамгаалах нь дансны
# түгжээ (registry.users.locked_until) ба консолын TOTP. Жинхэнэ клиентийн
# хаяг ирмэг дээр PROXY protocol асмагц хуучин тоо руу буцна.
limit_req_zone $binary_remote_addr zone=petronet_auth:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=petronet_oauth:10m rate=600r/m;

server {
    listen 80;
    server_name petronet.mn www.petronet.mn;

    # Own the stable response headers at the public edge. Both upstreams also
    # emit them, so hide those copies first: duplicated X-Frame-Options is not
    # interpreted consistently by browsers. The web's per-request CSP is the
    # exception and passes through unchanged because its nonce belongs to the
    # HTML response.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Excel тайлан илгээх зам. Анхдагч нь 1 МБ бөгөөд арван мянган мөртэй
    # workbook түүнээс том — хязгаарыг нэрлэхгүй орхивол илгээгч 413 авна.
    client_max_body_size 8m;

    # HTTP/2. Certbot нь `listen 443 ssl` мөрийг өөрөө бичдэг ба тэр мөрөнд
    # протоколыг нэмдэггүй, тиймээс энэ нь тусдаа заавар байх ёстой — тэгвэл
    # гэрчилгээ шинэчлэх бүрд алга болохгүй. Үүнгүй байсны улмаас энэ домэйн
    # HTTP/2 шилжилтийн дараа ч HTTP/1.1 дээр үлдсэн байв.
    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade, not a bare "upgrade": sending the header on
        # every request breaks upstream keepalive for the ordinary ones.
        proxy_set_header Connection $connection_upgrade;
    }

    # Байрлуулалтын өөрийн лого, icon: /opt/petronet/brand/ доторх файлууд.
    # Хоосон бол энэ хэсэг 404 хариулж, бүрхүүл образынхаа зургийг үзүүлнэ.
    location /brand/ {
        alias /opt/petronet/brand/;
        access_log off;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8098/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll нь 25 секунд онгорхой байдаг long poll. Анхдагч 60s
        # багтаах ч хэн нэгэн сохроор чангалахгүйн тулд бичив.
        proxy_read_timeout 90s;
    }

    # Хязгаарлалт нь орох цэг дээрээ. PetroNet System хүнийг өөрөө таньдаг тул
    # эдгээр зам бол жинхэнэ нэвтрэх хаалга.
    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=petronet_auth burst=100 nodelay;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- OIDC
    # Цөмийн snippet-ийн агуулга, зөвхөн энэ стекийн порт руу. PetroNet System
    # өөрөө провайдер: дээр нь суусан аппууд эндээс identity авна.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Яг таарах нь дээрх угтварыг дийлнэ гэдгийг nginx баталгаажуулдаг тул
    # токен солилцоо өөрийн хязгаарлалттай хэвээр.
    location = /oauth2/token {
        limit_req zone=petronet_oauth burst=200 nodelay;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/appstore-keys.json {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/urtuu.json {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
